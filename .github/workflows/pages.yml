# pages.yml —— GitHub Pages 自动部署（v1.7.1）
#
# 触发：push 到 main（或手动 workflow_dispatch）。
# 流程：pnpm install --frozen-lockfile → vite build → 上传 dist → deploy-pages。
#
# 首次启用（一次性，需在 GitHub 网页操作）：
#   repo Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
#   部署地址 = https://<用户名>.github.io/<仓库名>/（本仓库 → /kline-chart-component/，
#   base 已在 vite.config.ts 写死为该路径；若仓库改名，改 vite.config.ts 的 base 即可）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署（避免并发互相覆盖）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本锁定（v1.7.1：项目包管理已从 npm 全面切换 pnpm）
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check + Build
        run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
